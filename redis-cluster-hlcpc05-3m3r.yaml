# =============================================================================
# Redis Cluster (3 masters + 3 replicas) on Kubernetes - hlcpc05 namespace
#
# Real sharded cluster with failure isolation. Every master shares a node
# with a replica of a DIFFERENT master, so M_i and R_i (the replica of M_i)
# are never on the same node - failover actually works.
#
# Node + path layout (3 worker nodes, 2 host paths per node, 6 PVs total):
#
#   hl19f-5gc-com115 : M0 (/u01/data/redis-pv-master) + R2 (/u01/data/redis-pv-replica)
#   hl19f-5gc-com116 : M1 (/u01/data/redis-pv-master) + R0 (/u01/data/redis-pv-replica)
#   hl19f-5gc-com117 : M2 (/u01/data/redis-pv-master) + R1 (/u01/data/redis-pv-replica)
#
# Mapping kept by start.sh rotation:
#   R0 (node2) replicates M2 (node3)  - different node OK
#   R1 (node3) replicates M0 (node1)  - different node OK
#   R2 (node1) replicates M1 (node2)  - different node OK
#
# topologySpreadConstraints (required) below pin one master per node and one
# replica per node. Combined with the start.sh rotation that maps replica-N to
# master-((N+2) % 3), the M_i vs R_i invariant holds in any deploy where all
# 3 worker nodes are schedulable.
#
# Resource budget per pod: 1 CPU / 3Gi RAM. Storage: 5Gi.
#
# PRE-REQUISITE (do once per worker node; also create the StorageClass once):
#   for n in hl19f-5gc-com115 hl19f-5gc-com116 hl19f-5gc-com117; do
#     ssh $n 'mkdir -p /u01/data/redis-pv-master /u01/data/redis-pv-replica'
#   done
# StorageClass "redis-local" (no-provisioner / WaitForFirstConsumer / Retain)
# is NOT defined here - create it once with:
#   kubectl apply -f - <<'EOF'
#   apiVersion: storage.k8s.io/v1
#   kind: StorageClass
#   metadata: {name: redis-local}
#   provisioner: kubernetes.io/no-provisioner
#   volumeBindingMode: WaitForFirstConsumer
#   reclaimPolicy: Retain
#   EOF
#
# Apply:
#   kubectl apply -f redis-cluster-hlcpc05-3m3r.yaml
#
# Verify:
#   kubectl -n hlcpc05 exec redis-master-0 -- redis-cli cluster info   # state ok, slots 16384, size 3, known_nodes 6
#   kubectl -n hlcpc05 exec redis-master-0 -- redis-cli cluster nodes   # each M_* and the replica of a DIFFERENT master
#   kubectl -n hlcpc05 exec redis-master-0 -- redis-cli FT._LIST        # 12 idx:* indexes
#
# In-cluster consumers (lib/database, DATABASE_TYPE=redis):
#   REDIS_ADDRS=redis-master-0.redis-cluster:6379,redis-master-1.redis-cluster:6379,redis-master-2.redis-cluster:6379
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata: {name: hlcpc05}
---
# ============================ STORAGE CLASS =================================
# Cluster-scoped (not namespaced). Included so a FRESH cluster gets the
# no-provisioner class the PVs/PVCs reference, with WaitForFirstConsumer
# (PVC binds only after the pod is scheduled -> each PVC pairs with the PV
# on the node the scheduler chose).
# WHY IT ALSO RUNS WITHOUT THIS OBJECT: static PV<->PVC binding only string-
# matches storageClassName, so omitting the class still binds - just with
# Immediate semantics (binding before pod placement) instead. See NOTES.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: redis-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
# ============================ LOCAL PERSISTENT VOLUMES ======================
# 6 PVs: 3 master (path /u01/data/redis-pv-master) + 3 replica
# (path /u01/data/redis-pv-replica), one of each per worker node. Each PV is
# labeled role=master|replica so the STS PVC selectors bind the right one
# (a master pod never binds a replica PV, and vice versa).
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hlcpc05-redis-pv-master-node1
  labels: {app: redis-cluster, role: master}
spec:
  capacity: {storage: 10Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: redis-local
  local: {path: /u01/data/redis-pv-master}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [hl19f-5gc-com115]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hlcpc05-redis-pv-master-node2
  labels: {app: redis-cluster, role: master}
spec:
  capacity: {storage: 10Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: redis-local
  local: {path: /u01/data/redis-pv-master}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [hl19f-5gc-com116]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hlcpc05-redis-pv-master-node3
  labels: {app: redis-cluster, role: master}
spec:
  capacity: {storage: 10Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: redis-local
  local: {path: /u01/data/redis-pv-master}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [hl19f-5gc-com117]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hlcpc05-redis-pv-replica-node1
  labels: {app: redis-cluster, role: replica}
spec:
  capacity: {storage: 10Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: redis-local
  local: {path: /u01/data/redis-pv-replica}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [hl19f-5gc-com115]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hlcpc05-redis-pv-replica-node2
  labels: {app: redis-cluster, role: replica}
spec:
  capacity: {storage: 10Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: redis-local
  local: {path: /u01/data/redis-pv-replica}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [hl19f-5gc-com116]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hlcpc05-redis-pv-replica-node3
  labels: {app: redis-cluster, role: replica}
spec:
  capacity: {storage: 10Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: redis-local
  local: {path: /u01/data/redis-pv-replica}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [hl19f-5gc-com117]}
---
# =========================== CONFIG (start script) ===========================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-scripts-3m3r
  namespace: hlcpc05
data:
  start.sh: |
    #!/bin/sh
    set -eu

    ANNOUNCE_IP="${REDIS_ANNOUNCE_IP:-${POD_IP}}"
    ROLE="${REDIS_ROLE:-master}"
    SVC="redis-cluster"
    mkdir -p /data

    cat > /tmp/redis.conf <<EOF
    port 6379
    bind 0.0.0.0
    protected-mode no

    # --- RediSearch (FT.*) - REQUIRED by lib/database EnsureIndexes ---
    enable-module-command local
    loadmodule /usr/local/lib/redis/modules/redisearch.so
    loadmodule /usr/local/lib/redis/modules/redistimeseries.so

    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-announce-ip ${ANNOUNCE_IP}
    cluster-announce-port 6379
    cluster-announce-bus-port 16379
    cluster-node-timeout 15000

    dir /data
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    save ""

    maxmemory-policy noeviction
    timeout 0
    tcp-keepalive 300
    repl-diskless-sync yes
    repl-diskless-sync-delay 5
    EOF

    echo "[start.sh] pod=${POD_NAME} role=${ROLE} announce_ip=${ANNOUNCE_IP}"
    redis-server /tmp/redis.conf &
    REDIS_PID=$!

    i=0
    until redis-cli ping 2>/dev/null | grep -q PONG; do
      i=$((i+1)); [ $i -gt 30 ] && echo "FATAL: redis never became reachable" && exit 1; sleep 1
    done

    # ---- Decide: rejoin a built cluster, or rebuild from scratch ----
    # The leader (redis-master-0) owns the authoritative view. Every other
    # pod asks the leader (stable DNS) how many slots the cluster has:
    #   16384 -> cluster is built: REJOIN path. Do NOT CLUSTER RESET (a
    #           reset on a single restarting pod would orphan it from the
    #           live cluster); just MEET the leader so gossip carries our
    #           (possibly new) pod IP to every peer.
    #   else  -> cluster is missing/unbuilt: REBUILD path. Every pod
    #           CLUSTER RESET HARDs itself clean (forgets stale gossip that
    #           would make `--cluster create` fail with "Node is not
    #           empty"), then the leader bootstraps all 6 nodes.
    LEADER_HOST="redis-master-0.${SVC}"
    IS_LEADER=0
    [ "${POD_NAME}" = "redis-master-0" ] && IS_LEADER=1

    slots_of() { redis-cli -h "$1" cluster info 2>/dev/null | grep cluster_slots_assigned | tr -d ' \r' | cut -d: -f2; }

    CLUSTER_BUILT=0
    if [ "$IS_LEADER" = "1" ]; then
      # Leader asks itself. A freshly restarted leader still holds its
      # persisted nodes.conf view; if it reports a full slot map the cluster
      # exists, so rejoin instead of tearing it down.
      LASSIGNED=$(slots_of 127.0.0.1)
      [ "$LASSIGNED" = "16384" ] && CLUSTER_BUILT=1
    else
      # Wait for the leader to come up (it may still be starting), then ask.
      j=0
      until redis-cli -h "$LEADER_HOST" ping 2>/dev/null | grep -q PONG; do
        j=$((j+1)); [ $j -gt 60 ] && echo "WARNING: leader $LEADER_HOST not reachable" && break; sleep 2
      done
      if redis-cli -h "$LEADER_HOST" ping 2>/dev/null | grep -q PONG; then
        LASSIGNED=$(slots_of "$LEADER_HOST")
        [ "$LASSIGNED" = "16384" ] && CLUSTER_BUILT=1
      fi
    fi
    echo "[start.sh] cluster_built=${CLUSTER_BUILT} (leader slots=${LASSIGNED:-unreachable})"

    if [ "$CLUSTER_BUILT" = "0" ]; then
      # ================= REBUILD PATH =================
      # Clean this node so no stale gossip blocks the bootstrap.
      echo "[start.sh] CLUSTER RESET HARD (forget stale peers + release slots)"
      redis-cli cluster reset hard 2>/dev/null || true
      sleep 1

      if [ "$IS_LEADER" = "1" ]; then
        echo "[start.sh] leader: rebuilding 3M+3R cluster"
        # Wait until all 6 pods answer PING, then build. Bootstrap must run
        # BEFORE any pre-emptive MEET, otherwise the leader's nodes.conf
        # already knows a peer and --cluster create rejects it with
        # "Node ... is not empty".
        for n in 0 1 2; do
          for H in "redis-master-${n}.${SVC}" "redis-replica-${n}.${SVC}"; do
            k=0
            until redis-cli -h "$H" ping 2>/dev/null | grep -q PONG; do
              k=$((k+1)); [ $k -gt 90 ] && echo "WARNING: $H never came up" && break; sleep 2
            done
          done
        done
        redis-cli --cluster create \
          redis-master-0.${SVC}:6379 redis-master-1.${SVC}:6379 redis-master-2.${SVC}:6379 \
          redis-replica-0.${SVC}:6379  redis-replica-1.${SVC}:6379  redis-replica-2.${SVC}:6379  \
          --cluster-replicas 1 --cluster-yes 2>&1 || \
          echo "[start.sh] --cluster create returned non-zero - continuing"
        sleep 3
      else
        echo "[start.sh] non-leader rebuild: reset done, leader bootstraps; MEET below"
        sleep 5
      fi
    else
      echo "[start.sh] cluster already built - rejoin path (no reset)"
    fi

    # ---- CLUSTER MEET the leader - ALWAYS (idempotent reconcile) ----
    # MEET is two-way: the leader learns this pod's current IP and this pod
    # learns the leader's, then gossip propagates both to every peer. On a
    # first boot (rebuild path) this runs AFTER --cluster create and simply
    # re-affirms the link; on a single-pod restart (rejoin path) it is what
    # heals the cluster's stale address entry for this pod.
    j=0
    until redis-cli -h "$LEADER_HOST" ping 2>/dev/null | grep -q PONG; do
      j=$((j+1)); [ $j -gt 60 ] && echo "WARNING: $LEADER_HOST not reachable" && break; sleep 2
    done
    if redis-cli -h "$LEADER_HOST" ping 2>/dev/null | grep -q PONG; then
      MEET_IP=$(getent hosts "$LEADER_HOST" | awk '{print $1}' | head -n1)
      echo "[start.sh] MEET $LEADER_HOST ($MEET_IP)"
      redis-cli cluster meet "$MEET_IP" 6379 2>/dev/null || true
      sleep 2
    fi

    # ---- REPLICA: pin to the rotated master every boot ----
    # Rotation (i+2)%3 breaks the "M_i and R_i land on the same node" default:
    # with topologySpreadConstraints masters M0/1/2 -> nodes 1/2/3 and replicas
    # R0/1/2 -> nodes 2/3/1, R0 ends up on node2 while its target M2 is on
    # node3 - so R(0)'s master is on a different node. Same for R1/R2.
    if [ "$ROLE" = "replica" ]; then
      ORDINAL="${POD_NAME##*-}"          # redis-replica-N -> N
      ROT=$(( (ORDINAL + 2) % 3 ))
      MASTER_HOST="redis-master-${ROT}.${SVC}"
      if redis-cli -h "$MASTER_HOST" ping 2>/dev/null | grep -q PONG; then
        MID=$(redis-cli -h "$MASTER_HOST" cluster myid 2>/dev/null | tr -d ' \r')
        if [ -n "$MID" ]; then
          echo "[start.sh] replica-${ORDINAL} -> replicate $MID (master-${ROT})"
          redis-cli cluster replicate "$MID" 2>/dev/null || true
        fi
      else
        echo "WARNING: master $MASTER_HOST not reachable - replicate skipped; retry next boot"
      fi
    fi

    # ---- 12 RediSearch indexes (idempotent; masters only) ----
    if [ "$ROLE" = "master" ]; then
      echo "[start.sh] ensuring 12 indexes (pod=${POD_NAME})..."
      redis-cli FT.CREATE idx:smf:Session     ON HASH PREFIX 1 smf:Session:     INDEXALL ENABLE NOOFFSETS NOFREQS NOHL FILTER '!contains(@__key, "-delete")' SCHEMA identifier TAG SEID TAG FTEIDC TAG TEIDC TAG TEIDU TAG Dnn TAG IPType TAG State TAG SNSSAI TAG RATType TAG usingDynamic TAG MSISDN TAG WITHSUFFIXTRIE IP TAG WITHSUFFIXTRIE UpfSelection NUMERIC NBearer NUMERIC Timer NUMERIC SORTABLE 2>/dev/null || true
      redis-cli FT.CREATE idx:smf:SessionDel  ON HASH PREFIX 1 smf:Session:     INDEXALL ENABLE NOOFFSETS NOFREQS NOHL FILTER 'contains(@__key, "-delete")'  SCHEMA identifier TAG SEID TAG FTEIDC TAG TEIDC TAG TEIDU TAG Dnn TAG IPType TAG State TAG SNSSAI TAG RATType TAG usingDynamic TAG MSISDN TAG WITHSUFFIXTRIE IP TAG WITHSUFFIXTRIE UpfSelection NUMERIC NBearer NUMERIC Timer NUMERIC SORTABLE 2>/dev/null || true
      redis-cli FT.CREATE idx:smf:lawfultask  ON HASH PREFIX 1 smf:lawful:task: INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA X1ID TAG 2>/dev/null || true
      redis-cli FT.CREATE idx:smf:bypass      ON HASH PREFIX 1 smf:bypass:      INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA attachTime NUMERIC 2>/dev/null || true
      redis-cli FT.CREATE idx:smf:ee          ON HASH PREFIX 1 smf:ee:          INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA supi TAG pduSessionId NUMERIC anyUe NUMERIC 2>/dev/null || true
      redis-cli FT.CREATE idx:cdr:buf         ON HASH PREFIX 1 cdr:buf:         INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA createdAt NUMERIC 2>/dev/null || true
      redis-cli FT.CREATE idx:sgwc:bearer     ON HASH PREFIX 1 sgwc:bearer:     INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA startTime NUMERIC imsi TAG INDEXMISSING apn TAG 2>/dev/null || true
      redis-cli FT.CREATE idx:sgwc:s5         ON HASH PREFIX 1 sgwc:s5:         INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA startTime NUMERIC 2>/dev/null || true
      redis-cli FT.CREATE idx:sgwc:s11        ON HASH PREFIX 1 sgwc:s11:        INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA startTime NUMERIC 2>/dev/null || true
      redis-cli FT.CREATE idx:sgwc:seid       ON HASH PREFIX 1 sgwc:seid:       INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA startTime NUMERIC 2>/dev/null || true
      redis-cli FT.CREATE idx:sgwc:imsi2teid  ON HASH PREFIX 1 sgwc:imsi2teid:  INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA startTime NUMERIC 2>/dev/null || true
      redis-cli FT.CREATE idx:smf:alarm       ON HASH PREFIX 1 smf:alarm:       INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA location TAG 2>/dev/null || true
      
      # ---- Benchmark Index ----
      # Index riêng dùng cho quá trình chạy benchmark (tương đương với schema trong redis.go)
      # Bổ sung thêm NOOFFSETS NOFREQS NOHL để tối ưu memory/CPU giống với index thực tế
      redis-cli FT.CREATE idx_hash            ON HASH PREFIX 1 bench:key:       INDEXALL ENABLE NOOFFSETS NOFREQS NOHL SCHEMA Dnn TAG IPType TAG State TAG Timer NUMERIC SEID TAG startTime NUMERIC attachTime NUMERIC FTEIDC TAG IP TAG SNSSAI TAG UpfSelection NUMERIC TEIDC TAG 2>/dev/null || true
      
      echo "FT._LIST:"; redis-cli FT._LIST 2>/dev/null || true
    fi

    sleep 2
    echo "--- cluster info (pod=${POD_NAME}) ---"
    redis-cli cluster info | grep -E 'cluster_state|cluster_slots_assigned|cluster_slots_ok|cluster_known_nodes|cluster_size'
    echo "--- cluster nodes (pod=${POD_NAME}) ---"
    redis-cli cluster nodes

    wait $REDIS_PID
---
# ================================= SERVICES ==================================
---
apiVersion: v1
kind: Service
metadata: {name: redis-cluster, namespace: hlcpc05, labels: {app: redis-cluster}}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: redis-cluster}
  ports:
    - {name: client, port: 6379, targetPort: 6379}
    - {name: bus,    port: 16379, targetPort: 16379}
---
apiVersion: v1
kind: Service
metadata: {name: redis-master, namespace: hlcpc05, labels: {app: redis-cluster}}
spec:
  type: ClusterIP
  selector: {app: redis-cluster, role: master}
  ports:
    - {name: client, port: 6379, targetPort: 6379}
    - {name: bus,    port: 16379, targetPort: 16379}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: hlcpc05, labels: {app: redis-cluster}}
spec:
  type: LoadBalancer
  externalIPs:
    - 192.168.5.87
  selector: {app: redis-cluster}
  ports:
    - {name: client, port: 6379, targetPort: 6379}
---
# ============================ STATEFULSET: MASTERS ==========================
# 3 masters, pinned one-per-node via topologySpreadConstraints (required).
# PVC selector role=master binds the master host-path PV on whatever node the
# scheduler chose.
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis-master, namespace: hlcpc05, labels: {app: redis-cluster, role: master}}
spec:
  serviceName: redis-cluster
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: redis-cluster, role: master}
  template:
    metadata:
      labels: {app: redis-cluster, role: master}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels: {app: redis-cluster, role: master}
      volumes:
        - name: scripts
          configMap:
            name: redis-cluster-scripts-3m3r
            defaultMode: 0755
      containers:
        - name: redis
          image: 172.20.1.22/proxy-cache/redis:8.10
          command: ["/scripts/start.sh"]
          ports:
            - {name: client, containerPort: 6379}
            - {name: bus,    containerPort: 16379}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_IP,   valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: REDIS_ROLE, value: "master"}
            - {name: REDIS_ANNOUNCE_IP, value: ""}
          readinessProbe:
            exec: {command: ["redis-cli", "-h", "127.0.0.1", "ping"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "-h", "127.0.0.1", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits:   {cpu: "2", memory: 6Gi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
            - {name: data,    mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: redis-local
        selector:
          matchLabels: {role: master}
        resources:
          requests: {storage: 10Gi}
---
# ============================ STATEFULSET: REPLICAS =========================
# 3 replicas, spread one-per-node (DoNotSchedule). The start.sh rotation pins
# replica-N to master-((N+2) % 3), so a replica never shares a node with the
# master it copies - the failure-isolation invariant the user asked for.
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis-replica, namespace: hlcpc05, labels: {app: redis-cluster, role: replica}}
spec:
  serviceName: redis-cluster
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: redis-cluster, role: replica}
  template:
    metadata:
      labels: {app: redis-cluster, role: replica}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels: {app: redis-cluster, role: replica}
      volumes:
        - name: scripts
          configMap:
            name: redis-cluster-scripts-3m3r
            defaultMode: 0755
      containers:
        - name: redis
          image: 172.20.1.22/proxy-cache/redis:8.10
          command: ["/scripts/start.sh"]
          ports:
            - {name: client, containerPort: 6379}
            - {name: bus,    containerPort: 16379}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_IP,   valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: REDIS_ROLE, value: "replica"}
            - {name: REDIS_ANNOUNCE_IP, value: ""}
          readinessProbe:
            exec: {command: ["redis-cli", "-h", "127.0.0.1", "ping"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "-h", "127.0.0.1", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits:   {cpu: "2", memory: 6Gi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
            - {name: data,    mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: redis-local
        selector:
          matchLabels: {role: replica}
        resources:
          requests: {storage: 10Gi}
---
# =============================================================================
# NOTES
#
# 1. Failure-isolation invariant:
#    topologySpreadConstraints spread M0..M2 and R0..R2 one-per-node. The
#    start.sh rotation (replica-N -> master-((N+2) % 3)) then pins each replica
#    to a master whose ordinal lives on a different node. So losing one worker
#    node takes a master *or* its replica, never both - the surviving side
#    keeps the shard alive.
#
# 2. PVC selector role=master|replica is what makes each pod bind the right
#    host path on the node the scheduler picked (master pods always get the
#    redis-pv-master PVs, replicas always get the redis-pv-replica PVs).
#
# 3. Persistence correctness check after deploy:
#      kubectl -n hlcpc05 exec redis-master-0 -- sh -c 'df -h /data; mount | grep /data'
#    /data MUST appear as a real mount backed by the local PV.
#
# 4. Pre-req on every worker node (do once before first apply):
#      mkdir -p /u01/data/redis-pv-master /u01/data/redis-pv-replica
#    The local PV path must already exist; kubelet does NOT create it. Also
#    create the StorageClass "redis-local" once (header above).
#
# 5. Wire CPC services (lib/database) after first apply:
#      DATABASE_TYPE=redis
#      REDIS_ADDRS=redis-master-0.redis-cluster:6379,redis-master-1.redis-cluster:6379,redis-master-2.redis-cluster:6379
#      REDIS_INIT_INDEX=true     (owning service only - e.g. ctx)
#      REDIS_READ_REPLICA=true
#
# 6. Do NOT apply on top of the 1M+1R manifest. Delete its STSs/PVCs/PVs (and
#    optionally wipe the host paths) before applying this one.
# =============================================================================
