# BenchmarkDB - Cấu hình mẫu
# Sao chép file này và chỉnh sửa theo nhu cầu.
# Chạy: ./benchmarkDB --config config.yaml

database:
  type: aerospike # Loại database: "redis" hoặc "aerospike" (phase 2)


# Cấu hình Redis Cluster
redis:
  addresses:
#    - "172.16.115.27:6379"
#    - "172.16.115.47:6379"
#    - "172.16.115.36:6379"
     - "redis-master-0.redis-cluster.db-benchmark.svc.cluster.local:6379"
     - "redis-master-1.redis-cluster.db-benchmark.svc.cluster.local:6379"
     - "redis-master-2.redis-cluster.db-benchmark.svc.cluster.local:6379"
    # - redis-cluster.db-benchmark.svc.cluster.local:6379

# Cấu hình Aerospike
aerospike:
  hosts:                  # Tất cả host đều được dùng làm seed node
#    - "172.16.129.183"
#    - "172.16.6.163"
    - "db-0.aerospike.db-benchmark.svc.cluster.local:3000"
    - "db-1.aerospike.db-benchmark.svc.cluster.local:3000"
    # - db-0.aerospike.hlcpc01.svc.cluster.local:3000
    # - db-1.aerospike.hlcpc01.svc.cluster.local:3000
    # - db-2.aerospike.hlcpc01.svc.cluster.local:3000
  namespace: smf
  set: benchmark_session
  timeout: "3s"           # Timeout GET/SET/DELETE (giống ReadTimeout/WriteTimeout của Redis)

# Cấu hình dữ liệu
data:
  key_count: 100000       # Số lượng key khác nhau trong benchmark
  payload_size: 64        # Kích thước value (bytes) cho mỗi lệnh SET
  seed: 12345             # Random seed - đảm bảo reproducibility

# Cấu hình tải
load:
  target_tps: 50000       # Số request/giây mục tiêu (chỉ dùng cho mode run)
  max_concurrency: 64     # Số worker song song
  queue_size: 10       # Kích thước hàng đợi request. 10000 ở 50k TPS ≈ 200ms đệm trước khi bắt đầu drop

# Tỉ lệ workload (trọng số tương đối)
# Ví dụ: get=50, set=30, delete=20 → 50% GET, 30% SET, 20% DELETE
workload:
  get: 30
  set: 25
  delete: 15
  query_tag: 10
  query_numeric: 5

# Warmup: chạy trước khi đo chính thức, kết quả bị bỏ qua
warmup:
  duration: "5s"

# Thời gian chạy benchmark chính thức
benchmark:
  duration: "10s"

# Chính sách shutdown
shutdown:
  grace_period: "5s"      # Thời gian chờ in-flight requests hoàn thành
