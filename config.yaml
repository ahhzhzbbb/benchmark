# BenchmarkDB - Cấu hình mẫu
# Sao chép file này và chỉnh sửa theo nhu cầu.
# Chạy: ./benchmarkDB --config config.yaml

database:
  type: redis # Loại database: "redis" hoặc "aerospike" (phase 2)

# Cấu hình Redis Cluster
redis:
  addresses:
    - "172.16.115.47:6379"
#    - "172.16.115.13:6379"
#    - "172.16.115.16:6379"
#    - "redis-master-0.reds-cluster-svc.hlcpc05.svc.cluster.local:6379"
#    - "redis-master-1.reds-cluster-svc.hlcpc05.svc.cluster.local:6379"
#    - "redis-master-2.reds-cluster-svc.hlcpc05.svc.cluster.local:6379"

# Cấu hình Aerospike (chưa implement - Phase 2)
aerospike:
  hosts:
    - "172.16.129.183"
    - "172.16.6.163"
  namespace: smf
  set: benchmark_session

# Cấu hình dữ liệu
data:
  key_count: 100000       # Số lượng key khác nhau trong benchmark
  payload_size: 64        # Kích thước value (bytes) cho mỗi lệnh SET
  seed: 12345             # Random seed - đảm bảo reproducibility

# Cấu hình tải
load:
  target_tps: 50000       # Số request/giây mục tiêu (chỉ dùng cho mode run)
  max_concurrency: 64     # Số worker song song
  queue_size: 10000       # Kích thước hàng đợi request

# Tỉ lệ workload (trọng số tương đối)
# Ví dụ: get=50, set=30, delete=20 → 50% GET, 30% SET, 20% DELETE
workload:
  get: 0
  set: 0
  delete: 0
  query: 100

# Warmup: chạy trước khi đo chính thức, kết quả bị bỏ qua
warmup:
  duration: "5s"

# Thời gian chạy benchmark chính thức
benchmark:
  duration: "10s"

# Chính sách shutdown
shutdown:
  grace_period: "5s"      # Thời gian chờ in-flight requests hoàn thành
